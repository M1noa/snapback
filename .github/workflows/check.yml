# the gate, on every push. the same command the local gate runs (D4TODO phase 14).

name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: install
        run: bun install --frozen-lockfile
      - name: check
        run: bun run check
